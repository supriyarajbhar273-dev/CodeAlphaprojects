<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack - Fitness Tracker</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    header {
      background: #16a085;
      color: white;
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    header h1 {
      margin-bottom: 5px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .card h3 {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
      color: #16a085;
    }

    .form-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .form-card h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      margin-top: 18px;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #16a085;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #12816a;
    }

    .progress-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .progress-bar {
      height: 15px;
      background: #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress {
      height: 100%;
      background: #16a085;
      width: 0%;
      transition: width 0.4s;
    }

    .activities {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .activity {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .activity:last-child {
      border-bottom: none;
    }

    .activity-info strong {
      display: block;
      margin-bottom: 5px;
    }

    .delete-btn {
      background: #e74c3c;
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
    }

    .delete-btn:hover {
      background: #c0392b;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 700px) {
      .dashboard,
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🏃 FitTrack</h1>
      <p>Track your daily fitness activities</p>
    </header>

    <!-- Dashboard -->
    <div class="dashboard">

      <div class="card">
        <h3>Total Steps</h3>
        <div class="value" id="totalSteps">0</div>
      </div>

      <div class="card">
        <h3>Calories Burned</h3>
        <div class="value" id="totalCalories">0</div>
      </div>

      <div class="card">
        <h3>Workout Time</h3>
        <div class="value" id="totalTime">0 min</div>
      </div>

    </div>

    <!-- Steps Progress -->
    <div class="progress-card">
      <h2>🎯 Daily Step Goal</h2>
      <p id="stepText">0 / 10,000 steps</p>

      <div class="progress-bar">
        <div class="progress" id="stepProgress"></div>
      </div>
    </div>

    <!-- Add Activity -->
    <div class="form-card">

      <h2>➕ Log Fitness Activity</h2>

      <form id="activityForm">

        <div class="form-grid">

          <div>
            <label>Date</label>
            <input type="date" id="date" required>
          </div>

          <div>
            <label>Exercise Type</label>
            <select id="exercise" required>
              <option value="">Select exercise</option>
              <option>Walking</option>
              <option>Running</option>
              <option>Cycling</option>
              <option>Gym Workout</option>
              <option>Yoga</option>
              <option>Swimming</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label>Steps</label>
            <input type="number" id="steps" min="0" placeholder="e.g. 5000">
          </div>

          <div>
            <label>Workout Time (minutes)</label>
            <input type="number" id="time" min="0" placeholder="e.g. 30">
          </div>

          <div>
            <label>Calories Burned</label>
            <input type="number" id="calories" min="0" placeholder="e.g. 250">
          </div>

        </div>

        <button type="submit">Add Activity</button>

      </form>

    </div>

    <!-- Activities -->
    <div class="activities">

      <h2>📋 Recent Activities</h2>

      <div id="activityList">
        <p class="empty">No activities added yet.</p>
      </div>

    </div>

  </div>

  <script>

    let activities = JSON.parse(
      localStorage.getItem("fitnessActivities")
    ) || [];

    // Set today's date
    document.getElementById("date").value =
      new Date().toISOString().split("T")[0];


    // Add activity
    document.getElementById("activityForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const activity = {
          id: Date.now(),

          date: document.getElementById("date").value,

          exercise: document.getElementById("exercise").value,

          steps: Number(
            document.getElementById("steps").value
          ) || 0,

          time: Number(
            document.getElementById("time").value
          ) || 0,

          calories: Number(
            document.getElementById("calories").value
          ) || 0
        };

        activities.push(activity);

        saveData();

        this.reset();

        document.getElementById("date").value =
          new Date().toISOString().split("T")[0];

      });


    // Save data to localStorage
    function saveData() {

      localStorage.setItem(
        "fitnessActivities",
        JSON.stringify(activities)
      );

      updateDashboard();
      displayActivities();
    }


    // Update dashboard
    function updateDashboard() {

      let steps = 0;
      let calories = 0;
      let time = 0;

      activities.forEach(activity => {

        steps += activity.steps;
        calories += activity.calories;
        time += activity.time;

      });

      document.getElementById("totalSteps")
        .textContent = steps.toLocaleString();

      document.getElementById("totalCalories")
        .textContent = calories.toLocaleString();

      document.getElementById("totalTime")
        .textContent = time + " min";


      // Progress bar
      const percentage = Math.min(
        (steps / 10000) * 100,
        100
      );

      document.getElementById("stepProgress")
        .style.width = percentage + "%";

      document.getElementById("stepText")
        .textContent =
        `${steps.toLocaleString()} / 10,000 steps`;
    }


    // Display activities
    function displayActivities() {

      const list =
        document.getElementById("activityList");

      if (activities.length === 0) {

        list.innerHTML =
          '<p class="empty">No activities added yet.</p>';

        return;
      }

      list.innerHTML = "";

      activities
        .slice()
        .reverse()
        .forEach(activity => {

          const item = document.createElement("div");

          item.className = "activity";

          item.innerHTML = `
            <div class="activity-info">
              <strong>${activity.exercise}</strong>
              <span>
                ${activity.date} •
                ${activity.steps.toLocaleString()} steps •
                ${activity.time} min •
                ${activity.calories} calories
              </span>
            </div>

            <button
              class="delete-btn"
              onclick="deleteActivity(${activity.id})">
              Delete
            </button>
          `;

          list.appendChild(item);

        });
    }


    // Delete activity
    function deleteActivity(id) {

      activities = activities.filter(
        activity => activity.id !== id
      );

      saveData();
    }


    // Load data when app opens
    updateDashboard();
    displayActivities();

  </script>

</body>
</html>
